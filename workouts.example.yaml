# Example configuration. Copy it and edit to describe your own training:
#
#     cp workouts.example.yaml workouts.yaml
#
# workouts.yaml is gitignored, so your routine and Garmin ids stay private.
# Pass --config to use a file somewhere else entirely.
#
# One caveat about editing it: the one thing this tool writes back - a workout
# id Garmin has just issued - is written by re-dumping the whole file, so your
# comments and blank lines are lost the first time that happens. Put anything
# you want kept in an exercise's `notes`, which is part of the document.
#
# What follows is a complete, valid 3x/week A/B full body split. The
# garmin_name and garmin_category values are real Garmin identifiers, but the
# workout ids are placeholders -- replace them with your own (see below).
#
# This file drives the workout rather than describing it. `repwise update`
# builds a workout Garmin does not have, orders the exercises the way they are
# ordered here, adds and removes them to match, and writes the sets and rests
# below. What it does not decide is where each exercise has got to: the target
# lives in Garmin, and your sessions move it.
#
# Per-workout fields:
#   key                     the workout's name, and what a created workout is
#                           called in Garmin
#   garmin_workout_id       which Garmin workout this is. Leave it out and the
#                           workout is created, then the id is written back
#                           here -- the only thing ever written to this file
#   activity_prefixes       how a logged activity is matched to this workout
#   rest_between_exercises  seconds between exercises; leave it out to keep
#                           Garmin's own wait for the lap button
#
# Per-exercise fields, in the order they are performed:
#   name            label used in this tool's output
#   garmin_name     exercise name as stored in the Garmin workout
#   garmin_category Garmin's exercise category, used when the name does not
#                   match: Garmin auto-detects exercises while you lift, so the
#                   name it logs can differ from the programmed one, or be null
#   rep_low         bottom of the range, where each new weight starts
#   rep_high        top of the range; hitting it on every set earns a weight jump
#   rep_step        reps added when a target is met (default 1; use 2 when the
#                   watch counts each side separately)
#   sets            prescribed working sets
#   rest            seconds between sets, written to the Garmin workout;
#                   leave it out to keep whatever Garmin already prescribes
#   load            which of the `weights` below this is performed on, or
#                   bodyweight, which needs no entry there and never gains load
#   weight_step     kg added on a weight jump, overriding those weights' step
#   start_weight    kg a newly created exercise starts at; never read again
#                   once the step exists, progression owns the weight from then
#   unit            reps (default) or seconds for timed holds
#   notes           free text: a cue, a link, a reminder. Read by nobody -
#                   not this tool, not Garmin. Survives a rewrite of the file,
#                   which is what makes it the place for anything you would
#                   otherwise have written as a comment
#
# The range and the weight step are also summarised into each Garmin step's
# notes field -- "6-10 reps | +5 kg" -- so the watch shows what you are working
# towards. Editing them here is enough to refresh it on the next run, as it is
# for the rest: this file is the programming, not just a record of it.
#
# To find your own values:
#   1. Build the workouts in Garmin Connect, or write them here with no
#      garmin_workout_id and let `repwise update --apply` build them for you.
#   2. Take each garmin_workout_id from its Connect URL, e.g.
#      https://connect.garmin.com/modern/workout/111111111
#   3. Run `repwise fetch activities` after a session and read exerciseName
#      and category off the dumped JSON.

settings:
  garmin:
    # Where OAuth tokens are cached after the first interactive login, along with
    # Garmin's exercise catalog. When unset, this defaults to
    # $XDG_CONFIG_HOME/repwise (usually ~/.config/repwise).
    # What lands there is as good as being logged in, so keep it private and out of backups.
    # token_store: ~/.config/repwise
    # How many recent activities to scan for the last session, and for the
    # strength sessions `repwise fetch activities` downloads.
    activity_search_limit: 50
    # Where `fetch` writes its JSON. When unset, this defaults to
    # $XDG_DATA_HOME/repwise/dumps (usually ~/.local/share/repwise/dumps) -
    # durable rather than under ~/.cache, because this is where your history
    # lives once it has scrolled out of Garmin's search window. A relative path
    # here is relative to wherever you happen to run repwise, not to this file,
    # so with activity_caching on it means a separate cache per directory.
    # dump_dir: ~/.local/share/repwise/dumps
    # Read a session from dump_dir instead of asking Garmin for it again, and
    # file every session a run sees so the directory keeps itself current. A
    # cached copy is dropped as soon as Garmin's totals for that session stop
    # matching it, so correcting a set in Connect still reaches your targets.
    activity_caching: false

  # Whether a hit after a stall may move only some of the sets. On - the
  # default - a target that is climbing out of a stall can be uneven: `8+2` is
  # eight reps on every set with two of them asked for nine. Off, every set
  # moves together, a hit always adds a whole rep and a deload always takes
  # one off. Turning it off evens out any uneven target you already have,
  # upwards, on the next `repwise update`.
  # partial_progression: true

  # Your weight in kg. Normally left out: `check` reads it from your Garmin
  # weigh-ins, averaged over 30 days, so it stays current on its own. State it
  # here if you do not weigh in, and it wins over anything Garmin has.
  # bodyweight: 81.0

# The weights you actually have, each set of them under a name of your own.
# An exercise's `load` names one of these, and that is what decides how it
# progresses. Every entry states:
#
#   min   required. The lightest this equipment goes, in kg: the smallest bar
#         on the rack, the lightest pair, the top plate of a stack. A deload
#         stops here rather than prescribing a weight you cannot make up.
#   step  required. kg added when an exercise on these weights tops out its
#         rep range.
#   max   optional. The heaviest it goes. Topping out the range stops here
#         rather than prescribing a weight you cannot load. Leave it out and
#         there is no ceiling, which is the right answer for a gym: the rack
#         outlasts you, and only equipment you own really runs out.
#
# The names are yours, and the point of them is that one word does not tell
# one rack from another. The dumbbells at home start at 1 kg and stop at 10;
# the two racks in the gym start heavier and run further. All three are
# "dumbbells", and only by naming them apart can a deload know what exists.
#
# `bodyweight` is the one name spoken for: an exercise loaded that way has no
# equipment, needs no entry here, and never gains load.
weights:
  barbell:
    min: 12.0
    step: 2.5

  cable:
    min: 5.0
    step: 5.0

  machine:
    min: 5.0
    step: 5.0

  # The pair in the spare room. Small, and it ends - which is why this one has
  # a max and the gym's do not.
  home_dumbbell:
    min: 1.0
    max: 10.0
    step: 1.0

  # The gym's fixed rack: heavier, and in 2 kg pairs rather than 1.
  gym_dumbbell:
    min: 4.0
    max: 40.0
    step: 2.0

  # The gym's other rack, adjustable and finer, for the small movements where
  # a 2 kg jump on a 10 kg lateral raise is a fifth of the load at once.
  gym_dumbbell_adjustable:
    min: 2.0
    max: 24.0
    step: 1.0

workouts:
  - key: Workout A
    garmin_workout_id: "111111111"
    # An activity is matched to this workout when its name starts with one of
    # these, case-insensitively. Add your own language if you rename sessions.
    activity_prefixes: ["workout a", "training a"]
    exercises:
      - name: Barbell Back Squat
        garmin_name: BARBELL_BACK_SQUAT
        garmin_category: SQUAT
        rep_low: 6
        rep_high: 10
        sets: 4
        rest: 120
        load: barbell
        # Squats recruit enough musculature to take bigger jumps than the
        # upper body lifts. Drop to the barbell default once 5 kg starts
        # failing.
        weight_step: 5.0
        # Free text, for whatever you want beside the exercise.
        notes: Bar high on the traps, knees tracking over the toes.

      - name: Barbell Bench Press
        garmin_name: BARBELL_BENCH_PRESS
        garmin_category: BENCH_PRESS
        rep_low: 6
        rep_high: 10
        sets: 4
        rest: 120
        load: barbell

      - name: Barbell Row
        garmin_name: BARBELL_ROW
        garmin_category: ROW
        rep_low: 8
        rep_high: 12
        sets: 4
        rest: 90
        load: barbell

      - name: Barbell Overhead Press
        garmin_name: OVERHEAD_BARBELL_PRESS
        garmin_category: SHOULDER_PRESS
        rep_low: 8
        rep_high: 12
        sets: 3
        rest: 120
        load: barbell

      - name: Dumbbell Biceps Curl
        garmin_name: DUMBBELL_BICEPS_CURL
        garmin_category: CURL
        rep_low: 10
        rep_high: 15
        sets: 3
        rest: 75
        load: gym_dumbbell

      - name: Cable Overhead Triceps Extension
        garmin_name: CABLE_OVERHEAD_TRICEPS_EXTENSION
        garmin_category: TRICEPS_EXTENSION
        rep_low: 10
        rep_high: 15
        sets: 3
        rest: 75
        load: cable

      # Appears in both workouts. A target earned in either one is synced to
      # the other, so the two copies cannot drift apart. Shared exercises must
      # be programmed identically everywhere; the config is rejected otherwise.
      #
      # bodyweight_factor says all of you rides on the stack, so `check` reads
      # a 20 kg setting as 100 kg of load and can see that a 5 kg step is a 5%
      # jump, not the 25% it looks like. That is what keeps the range narrow:
      # 15-18 is about what a 5% step pays for, where 12-20 would make every
      # weight increase a large step backwards.
      - name: Standing Calf Raise
        garmin_name: WEIGHTED_STANDING_CALF_RAISE
        garmin_category: CALF_RAISE
        rep_low: 15
        rep_high: 18
        sets: 3
        rest: 60
        load: machine
        bodyweight_factor: 1.0

      # A timed hold: the range is seconds, and it progresses one second at a
      # time rather than gaining load.
      - name: Plank
        garmin_name: PLANK
        garmin_category: PLANK
        rep_low: 30
        rep_high: 60
        sets: 3
        rest: 60
        load: bodyweight
        unit: seconds

  - key: Workout B
    garmin_workout_id: "222222222"
    activity_prefixes: ["workout b", "training b"]
    # Garmin waits for the lap button between exercises unless told otherwise.
    rest_between_exercises: 60
    exercises:
      - name: Barbell Deadlift
        garmin_name: BARBELL_DEADLIFT
        garmin_category: DEADLIFT
        rep_low: 6
        rep_high: 10
        sets: 3
        rest: 150
        load: barbell
        weight_step: 5.0

      # The watch counts each lunge separately, one per leg, so this is
      # programmed in the watch's units: double the usual 8-12 per leg, and
      # stepping by 2 keeps both legs even at 16, 18, 20, 22, 24.
      #
      # Done at home, so the small rack decides both ends. Its numbers are the
      # weight of one dumbbell, but a lunge is carried in both hands, so this
      # one overrides all three: the pair weighs twice what the rack says, and
      # `check` needs the stored weight to be the whole load. Once 20 kg is
      # being carried for the top of the range the load stops moving and the
      # target settles there - nothing heavier exists to prescribe.
      #
      # Most of you is on the working leg too, and that part the stored weight
      # cannot show, so bodyweight_factor says so.
      - name: Alternating Dumbbell Lunge
        garmin_name: ALTERNATING_DUMBBELL_LUNGE
        garmin_category: LUNGE
        rep_low: 16
        rep_high: 24
        rep_step: 2
        sets: 4
        rest: 90
        load: home_dumbbell
        weight_step: 2.0
        min_weight: 2.0
        max_weight: 20.0
        bodyweight_factor: 0.85

      # Note the category: Garmin files pulldowns under PULL_UP. Which is also
      # why bodyweight_factor is never inferred from the category - the machine
      # holds you down, so none of your weight is on this one, and the stored
      # weight is the whole load. No bodyweight_factor is the right answer here.
      - name: Lat Pull-down
        garmin_name: LAT_PULLDOWN
        garmin_category: PULL_UP
        rep_low: 8
        rep_high: 12
        sets: 4
        rest: 90
        load: cable

      - name: Incline Dumbbell Bench Press
        garmin_name: INCLINE_DUMBBELL_BENCH_PRESS
        garmin_category: BENCH_PRESS
        rep_low: 8
        rep_high: 12
        sets: 4
        rest: 90
        load: gym_dumbbell

      # On the adjustable rack rather than the fixed one: a 2 kg jump on a
      # 10 kg raise is a fifth of the load, which no rep range can absorb.
      - name: Dumbbell Lateral Raise
        garmin_name: DUMBBELL_LATERAL_RAISE
        garmin_category: LATERAL_RAISE
        rep_low: 12
        rep_high: 15
        sets: 3
        rest: 60
        load: gym_dumbbell_adjustable

      # Stored as WEIGHTED_LEG_CURL in the workout but logged as plain
      # LEG_CURL in activities, so the category is what bridges the two.
      - name: Leg Curl
        garmin_name: WEIGHTED_LEG_CURL
        garmin_category: LEG_CURL
        rep_low: 10
        rep_high: 15
        sets: 3
        rest: 75
        load: machine

      - name: Standing Calf Raise
        garmin_name: WEIGHTED_STANDING_CALF_RAISE
        garmin_category: CALF_RAISE
        rep_low: 15
        rep_high: 18
        sets: 3
        rest: 60
        load: machine
        bodyweight_factor: 1.0

      - name: Sit-up
        garmin_name: SIT_UP
        garmin_category: SIT_UP
        rep_low: 10
        rep_high: 15
        sets: 3
        rest: 60
        load: bodyweight
