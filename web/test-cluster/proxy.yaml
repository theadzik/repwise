# Stands in for oauth2-proxy, as it does in the local stack. A GitHub OAuth
# App has one callback URL and that belongs to the real site, so there is no
# real sign-in here. Reached by port-forward, never by an Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repwise-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repwise-proxy
  template:
    metadata:
      labels:
        app: repwise-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: proxy
        - name: tmp
          emptyDir: {}
