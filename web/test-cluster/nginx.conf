# Stands in for oauth2-proxy in the test namespace. It says who is signed in,
# which the real one learns from GitHub, and passes requests to the API's
# Service, which spreads them over the replicas.
pid /tmp/nginx.pid;
events {}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://repwise-api:8080;
            proxy_http_version 1.1;
            # With the port, as a browser's Origin has it: the Garmin login
            # compares the two.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-User tester;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }
}
