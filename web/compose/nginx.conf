# Stands in for oauth2-proxy in the local stack. It says who is signed in,
# which the real one learns from GitHub, and it sends each request to either
# API replica, which is what proves that neither remembers anything. The one
# exception is a Garmin login waiting on its code: Traefik's sticky cookie
# brings a browser back to the replica holding it, and here the address does.
events {}

http {
    upstream api {
        server api-1:8080;
        server api-2:8080;
    }

    upstream api_sticky {
        ip_hash;
        server api-1:8080;
        server api-2:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;

        location /api/v1/garmin/connection/login {
            proxy_pass http://api_sticky;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-User tester;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            # With the port, as a browser's Origin has it: the Garmin login
            # compares the two.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-User tester;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Which replica answered, for the checks to read.
            add_header X-Replica $upstream_addr always;
        }
    }
}
