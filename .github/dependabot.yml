version: 2

updates:
  # uv rather than pip, so a bump rewrites uv.lock alongside pyproject.toml
  # instead of leaving it stale for the next `uv run` to relock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    # uv does not support grouping by dependency-type, so the runtime
    # dependencies are named: a new one in [project] dependencies goes here too.
    groups:
      runtime:
        patterns:
          - "garminconnect"
          - "pyyaml"
      dev-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "garminconnect"
          - "pyyaml"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
    groups:
      actions:
        patterns:
          - "*"
