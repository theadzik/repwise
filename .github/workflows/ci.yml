name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; the checks only read the tree.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and its dev tooling
        # `-e .` for the project and its runtime dependencies; `--group dev`
        # for the tools that check it, which live in a PEP 735 group rather
        # than an extra so that they are not part of what PyPI ships.
        run: python -m pip install --quiet -e . --group dev

      # The hook environments, keyed on the two things that decide them: the
      # revs pinned in the config, and the interpreter the Python hooks are
      # built against. Without this every run reinstalls six remote
      # repositories, node included. The version is read back from the step
      # above rather than repeated, so it cannot drift from python-version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{
            hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit hooks
        env:
          RUFF_OUTPUT_FORMAT: github
        run: pre-commit run --all-files --show-diff-on-failure --hook-stage pre-commit

      - name: pre-push hooks
        if: ${{ !cancelled() }}
        run: pre-commit run --all-files --hook-stage pre-push
