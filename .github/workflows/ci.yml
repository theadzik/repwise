# The checks that decide whether a pull request may merge.
#
# pre-commit runs the hooks, rather than this file naming a subset of them by
# hand. .pre-commit-config.yaml is then the single list of what has to pass, so
# a hook added there is enforced here without anyone remembering to add it
# twice - which is the failure this arrangement exists to prevent. The
# difference from a local run is only when it happens: per commit and per push
# there, over the whole tree here.
#
# The stages are run as two steps because pre-commit has no "every stage" flag.
# Missing one is silent - the hooks in it simply do not run - so both are named
# explicitly. commit-msg is the exception and is deliberately absent: `cz check`
# validates one commit message and there is no message to hand it here. A
# squash merge takes its message from the pull request title, which this
# workflow never sees; docs/releasing.md covers that.
#
# Make this a required status check on `main`. release.yml enables auto-merge on
# the version bump pull request, and a required check is the only thing that
# makes that wait - without one, the bump merges the moment it is opened. See
# docs/releasing.md.
name: CI

on:
  pull_request:
  # Also on `main`, so the default branch has a run of its own saying it is
  # green, rather than only ever being checked before a merge.
  push:
    branches: [main]

permissions:
  contents: read

# A force-push to a pull request makes the run already in flight irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named for how it reads in the ruleset's required-checks list, so keep the
  # job id and the required check in step if either is renamed.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; the checks only read the tree.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          # The floor in requires-python, and what [tool.ruff]'s target-version
          # and [tool.mypy]'s python_version both name. Checking the oldest
          # supported Python is the useful direction: a newer one is already
          # what the development machine runs. The floor is this project's own
          # since 3.14 - the source uses PEP 649 annotations and argparse's
          # colour and did-you-mean output - rather than garminconnect's, which
          # is still >=3.12. All four move together when it moves.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and its dev tooling
        # Still needed with pre-commit driving: the mypy and pytest hooks are
        # `language: system` and run the tools from this environment, so they
        # need the dev extra's pins and an importable package. Editable, because
        # [tool.pytest.ini_options] puts src on the path.
        run: python -m pip install --quiet -e ".[dev]"

      # The hook environments, keyed on the two things that decide them: the
      # revs pinned in the config, and the interpreter the Python hooks are
      # built against. Without this every run reinstalls six remote
      # repositories, node included. The version is read back from the step
      # above rather than repeated, so it cannot drift from python-version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{
            hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit hooks
        # RUFF_OUTPUT_FORMAT is how the annotations survive the move: the hook
        # owns ruff's arguments, so --output-format cannot be passed here, but
        # ruff reads this and each finding still lands on the diff.
        env:
          RUFF_OUTPUT_FORMAT: github
        run: pre-commit run --all-files --show-diff-on-failure --hook-stage pre-commit

      # `!cancelled()` rather than the default, so a failing hook does not hide
      # the tests and a red run lists everything that is wrong at once. This is
      # the stage the pytest hook is registered for; it runs nothing else.
      - name: pre-push hooks
        if: ${{ !cancelled() }}
        run: pre-commit run --all-files --hook-stage pre-push
