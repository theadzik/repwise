name: Web

# The web service under web/: its tests, and its image.
#
# A pull request that touches web/ runs the tests and builds and scans the
# image without publishing it. A tag `repwise-web-<CalVer>`, such as
# repwise-web-2026.11.1, publishes ghcr.io/theadzik/repwise-web:2026.11.1,
# signed, where the homelab's Image Updater finds it. These tags are not
# repwise releases: commitizen is told to ignore them in pyproject.toml.

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    tags:
      - "repwise-web-*"
  # Weekly, so that a fixed base image is picked up without a code change.
  schedule:
    - cron: "37 11 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # What the tests are about is mostly what PostgreSQL does, so they run
    # against a real one.
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: repwise
          POSTGRES_PASSWORD: repwise
          POSTGRES_DB: repwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repwise"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Python the image ships, read from its Dockerfile rather than
      # written here, so that a base image Dependabot moves on moves the tests
      # with it.
      - name: The image's Python
        id: image
        run: |
          version=$(grep -m1 -oE 'dhi\.io/python:[0-9]+\.[0-9]+' ../Dockerfile | cut -d: -f2)
          test -n "$version"
          echo "python=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ steps.image.outputs.python }}

      - name: Install uv
        run: python -m pip install --quiet uv==0.13.7

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://repwise:repwise@127.0.0.1:5432/repwise
          # That Python, and not another uv might find first.
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        # From uv.lock exactly, so that what is tested is what the image holds.
        run: uv sync --frozen && uv run --frozen pytest -q

  get-tag:
    runs-on: ubuntu-latest
    outputs:
      git_tag: ${{ steps.newest.outputs.git_tag }}
      docker_tag: ${{ steps.newest.outputs.docker_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # The newest tag, whatever started the run: a scheduled rebuild
      # publishes the last release again on a fresh base image.
      - name: Newest image tag
        id: newest
        run: |
          git_tag=$(git tag --list 'repwise-web-*' | sort -V | tail -n 1)
          echo "git_tag=$git_tag" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${git_tag#repwise-web-}" >> "$GITHUB_OUTPUT"

  image:
    needs: [test, get-tag]
    # Nothing to publish before the first tag. A pull request still builds.
    if: ${{ github.event_name == 'pull_request' || needs.get-tag.outputs.git_tag != '' }}
    uses: theadzik/github-workflows/.github/workflows/build-and-push.yaml@c83c3e8f6838981737c0eee922da5fcac368537e # v4.1.1
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    with:
      # A pull request builds its own head, not the last released tag, or the
      # change under review is never what gets built.
      git-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || needs.get-tag.outputs.git_tag }}
      tags: "type=raw,value=${{ needs.get-tag.outputs.docker_tag || 'pull-request' }}"
      registry: ghcr.io
      image-name: "${{ github.repository_owner }}/repwise-web"
      registry-username: ${{ github.actor }}
      # The hardened base images.
      extra-registry: dhi.io
      extra-registry-username: ${{ vars.DOCKERHUB_USERNAME }}
      context-path: web
      scan: true
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      EXTRA_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
