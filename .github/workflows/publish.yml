name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Bump, commit and tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.bump.outputs.version }}
      publish: ${{ steps.pypi.outputs.publish }}
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Deliberately left behind in the checkout: pushing `main` with it is
          # the whole point of minting it above.
          # zizmor: ignore[artipacked] - this job pushes the bump to `main`
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Only used to run `cz`; nothing is built in this job. It is here
          # rather than left to the runner's own python3 because `--group`
          # below needs pip 25.1 or newer.
          python-version: "3.14"

      - name: Install commitizen
        run: python -m pip install --quiet --group release

      - name: Bump the version, then push the commit and the tag
        id: bump
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          read_version() {
            python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          }

          # Author the commit as the App's own bot, which is also the identity
          # the ruleset lets through. The numeric id is what makes GitHub link
          # the address to that account rather than leaving the commit
          # unattributed, and it is looked up rather than written down so that
          # recreating the App does not quietly leave a stale one here.
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/$bot" --jq .id)
          git config user.name "$bot"
          git config user.email "$bot_id+$bot@users.noreply.github.com"

          # No --version-files-only this time: the commit and the tag are made
          # here, together, against the commit that is about to become `main`.
          status=0
          cz bump --yes || status=$?

          # 3: no commits at all since the last tag. 21: commits, but none that
          # earn a release - a run of docs and chores. Neither is a failure and
          # neither ends the run, because the version already on `main` may
          # still be waiting to reach PyPI; that is what the next step decides.
          case "$status" in
            0) ;;
            3 | 21) echo "Nothing new to release - falling back to what is on main." ;;
            *) exit "$status" ;;
          esac

          version=$(read_version)

          if [ "$status" = 0 ]; then
            echo "Pushing $version to main."
            # Atomic, so the commit and the tag land together or not at all. A
            # half-push here is the one outcome with no clean recovery: `main`
            # carrying a version whose tag does not exist, or a tag on a commit
            # nobody else can see.
            git push --atomic origin HEAD:main "refs/tags/$version"
          elif git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already tagged."
          else
            # A version bumped by hand and merged as an ordinary pull request
            # leaves `main` carrying it with no tag. `cz` finds nothing to do
            # with such a commit, so the tag is cut here instead - the release
            # was still asked for.
            echo "Tagging $version, which reached main without one."
            git tag "$version"
            git push origin "refs/tags/$version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ask PyPI whether it has this version
        id: pypi
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          name=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")

          # Whether to publish is asked of PyPI rather than inferred from
          # whether this run bumped anything. A version is uploaded exactly
          # once and can never be replaced or reused, so the only question
          # worth asking is whether it is up there already - and asking it this
          # way is what makes an upload that failed halfway retryable by
          # dispatching again, when `cz bump` will correctly find nothing left
          # to bump.
          status=$(curl -sS -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$name/$VERSION/json")
          case "$status" in
            404) echo "$name $VERSION is not on PyPI yet."; publish=true ;;
            200) echo "$name $VERSION is already on PyPI."; publish=false ;;
            *) echo "::error::PyPI answered $status - refusing to guess whether $VERSION is published."; exit 1 ;;
          esac

          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build the distributions
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Check what PyPI will accept and render
        run: |
          python -m pip install --quiet twine
          twine check --strict dist/*
          ls -l dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.release.outputs.version }} to PyPI
    needs: [release, build]
    runs-on: ubuntu-latest
    environment:
      name: publish
      url: https://pypi.org/p/repwise
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
