[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repwise"
version = "3.3.0"
description = "Advance Garmin strength workout targets using double progression"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Adam Żmuda", email = "adam@zmuda.pro" },
]
keywords = ["garmin", "strength-training", "progressive-overload"]
# How PyPI files and filters this. Deliberately no "License :: OSI Approved"
# line: PEP 639 replaced those with the SPDX `license` field above, and
# setuptools refuses to build at all when both are present.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # One line per supported minor, and requires-python above is what actually
    # enforces it - this only decides what the sidebar on PyPI says.
    "Programming Language :: Python :: 3.14",
    # Trove has no classifier for fitness, training or sport, so this is the
    # closest honest fit.
    "Topic :: Utilities",
]
# Pinned to exact versions. This is an application rather than a library, so a
# reproducible install matters more than being co-installable, and Dependabot
# raises a PR per release. garminconnect in particular has broken
# authentication before, so the working version is recorded deliberately.
dependencies = [
    "garminconnect==0.3.11",
    "pyyaml==6.0.3",
]

# The sidebar on the PyPI page. Absolute, because the description rendered
# there is README.md torn out of the repository, where nothing relative
# resolves.
[project.urls]
Homepage = "https://github.com/theadzik/repwise"
Documentation = "https://github.com/theadzik/repwise/tree/main/docs"
Changelog = "https://github.com/theadzik/repwise/blob/main/CHANGELOG.md"
Issues = "https://github.com/theadzik/repwise/issues"

# Development tooling, as PEP 735 groups rather than extras. An extra is part
# of the package - installable by anyone from PyPI, and only alongside the
# package itself. These are neither: nobody installing repwise wants mypy, and
# the release workflow wants commitizen *without* building repwise at all.
# Groups install on their own, which is what makes that possible.
#
# `release` is split out because the release workflow needs commitizen and
# nothing else, and the version of commitizen decides the release rules - which
# commit types bump what, how the changelog renders. Pinning it here and
# including the group in `dev` means a local `cz bump --dry-run` and the
# workflow cannot disagree about the answer.
[dependency-groups]
release = [
    "commitizen==4.18.0",
]
dev = [
    { include-group = "release" },
    "coverage==7.16.0",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.5",
    "types-PyYAML==6.0.12.20260815",
]

[project.scripts]
repwise = "repwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Conventional commits in, version numbers out. `cz check` runs from
# .pre-commit-config.yaml on every commit message; `cz bump` reads the commits
# since the last tag and decides the release. See docs/releasing.md.
[tool.commitizen]
name = "cz_conventional_commits"
# Read and write [project].version above, so the version is stated once.
version_provider = "pep621"
# Bare "0.2.0", not "v0.2.0". This is Commitizen's own default and matches the
# hand-cut 0.1.0 tag, so it is stated only to pin it: the default has changed
# upstream before, and a silent change would start a second tag series.
tag_format = "$version"
version_files = ["src/repwise/__init__.py:__version__"]
update_changelog_on_bump = true
# History before 0.1.0 predates conventional commits, so there is nothing to
# generate a changelog from.
changelog_start_rev = "0.1.0"
# Commitizen's own Markdown template with a commit link on each entry. The path
# is resolved against the working directory, so `cz` has to run from the
# repository root - which is where both the hook and the workflow run it.
template = ".cz/CHANGELOG.md.j2"

# Linting and formatting. The pre-commit hook and a bare `ruff check` read this
# same section, so they cannot disagree.
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade: syntax available on the minimum Python
    "B",       # bugbear: likely bugs
    "C4",      # comprehension rewrites
    "SIM",     # simplifications
    "RET",     # return-statement hygiene
    "PIE",     # small correctness idioms
    "Q",       # quote consistency
    "RSE",     # raise cleanliness
    "SLF",     # private member access
    "BLE",     # blind except - the existing noqa comments name this rule
    "PL",      # pylint subset
    "RUF",     # ruff's own
    # Added as ratchets: each was already clean, so it costs nothing today and
    # refuses the first regression. See [[tool.mypy.overrides]] below for the
    # same reasoning applied to types.
    "LOG",     # logging misuse: a logger built by hand, warn() on the root
    "PGH",     # a bare `noqa` or `type: ignore` that names no rule
    "FURB",    # constructs with a plainer spelling
    "A",       # an argument or variable shadowing a builtin
    # A boolean argument read at the call site as a bare True is a coin flip
    # for the reader: `connect(settings, False)` says nothing about which of
    # two flags it set. Keyword-only, so the call says what it means. The one
    # exemption is `yamlio._Dumper.increase_indent`, whose signature is
    # PyYAML's rather than ours, and which says so.
    "FBT",     # boolean traps
    # `Any` in a signature where a real type exists. Where it has none - a
    # dump, a parsed document - the noqa says so rather than the annotation
    # quietly meaning nothing.
    "ANN401",  # dynamically typed signatures
]
ignore = [
    # This is a CLI whose job is printing, and its errors carry the detail a
    # user needs, so neither "no print" nor "no message in the raise" applies.
    # T201 and EM/TRY are left unselected for the same reason.
    #
    # Rewriting os.path to pathlib (PTH) and rejecting relative imports (TID252)
    # would both fight deliberate choices, so they stay unselected too.
    "PLR2004",  # magic values: tests compare against literal reps and weights
    "PLC0415",  # imports inside functions are deliberate here
    "RUF022",   # __all__ is ordered by meaning, not alphabetically
]

[tool.mypy]
# tools/ as well: the checks in there are part of the repository and read the
# same tree, so a wrong assumption about it should fail here rather than in a
# hook that then reports nonsense.
files = ["src", "tests", "tools"]
python_version = "3.14"
# A cast that is no longer needed is a leftover from a type that has since
# improved, and it silently keeps the old shape. Global rather than per-module
# because mypy offers it nowhere else.
warn_redundant_casts = true

# The shipped package is held to a stricter standard than the tests that drive
# it. Every flag here was already clean when it was added, so this locks in
# where the code got to rather than announcing a cleanup nobody is doing - a
# rule that fails the day it lands teaches people to skip the hook.
#
# `disallow_untyped_defs` is the one that matters, and the reason a bare `mypy`
# is not enough: without it the *bodies* of unannotated functions are never
# checked, so an unannotated function is a hole rather than a looser check.
# Deliberately not applied to tests, where 900-odd `def test_x():` signatures
# would be noise for no safety - the code under test is what has to be right.
[[tool.mypy.overrides]]
module = "repwise.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
# Comparing two types that can never be equal is always a bug, and the shapes
# this maps between - Garmin's strings against our enums and ints - are exactly
# where that happens silently.
strict_equality = true
extra_checks = true
warn_unreachable = true
# An ignore that stopped being needed is an ignore that now hides something.
warn_unused_ignores = true
# A bare `dict` or `list` is Any wearing a container, and this reads YAML and
# Garmin's JSON into both. Spelling the shape out is what stops Any spreading
# from the two files that have a reason for it into the ones that do not.
disallow_any_generics = true
# The value garminconnect hands back is Any, so without this a function can
# promise `dict[str, Any]` and return whatever came off the wire unchecked.
# `garmin/client.py` casts at the boundary instead, which is what an adapter is.
warn_return_any = true
# A name is imported from where it is defined, not from the last module that
# happened to import it - `ActivityNotFound` lives in `errors.py`, whoever else
# passes it through.
no_implicit_reexport = true

# garminconnect ships no type information. garmin/client.py is the only module
# that imports it, which is what keeping the adapter in one place buys.
[[tool.mypy.overrides]]
module = "garminconnect.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Coverage is a decay alarm, not a quality bar. It answers "was this line
# executed", never "would a test notice a wrong answer" - the audit that added
# these floors found three of its four bugs in covered code, one of them in a
# module sitting at 100%. So the floors are set at a decent distance below
# where the suite actually is, and are meant to fire when whole modules arrive
# untested rather than to be climbed towards. Test strength is a separate
# question, and mutation testing is what answers it.
[tool.coverage.run]
source = ["src"]
omit = [
    # Three lines that call main() and exit. Reaching them means running the
    # process, which is what tests/test_main.py does through main() itself.
    "src/repwise/__main__.py",
]

[tool.coverage.report]
#: The floor for the tree as a whole. Read by `tools/check_coverage.py` as well
#: as by `coverage report`, so there is one number rather than two that can
#: disagree.
fail_under = 90
